name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: o
      - uses: actions/checkout@v4
        with:
          repository: skyblanket/swarmrt
          path: swarmrt
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Build swarmrt compiler
        run: make -C swarmrt swc libswarmrt -j"$(nproc)"
      - name: Hermetic suite
        working-directory: o
        run: make check
      - name: Acceptance (stub agent)
        working-directory: o
        run: ./scripts/acceptance.sh
