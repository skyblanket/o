<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>O v4 — orchestrator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --bg:#0d0d0f; --surface:#161618; --surface2:#1c1c20; --hover:#26262c;
    --border:#2a2a30; --border2:#3a3a44;
    --text:#e6e6ea; --dim:#9a9aa6; --faint:#65656f;
    --accent:#7c6cf5; --accent-d:#5b4fd4;
    --green:#41b860; --red:#ef6b6b; --amber:#d8a657; --blue:#5b9bf3;
    --sh:0 8px 30px rgba(0,0,0,.5);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font:13px/1.5 'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:#2e2e36; border-radius:5px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background:#3a3a44; }

  button {
    font:inherit; cursor:pointer; border-radius:7px; border:1px solid var(--border2);
    background:var(--surface2); color:var(--text); padding:6px 12px; font-size:12px;
    font-weight:500; transition:.12s; white-space:nowrap;
  }
  button:hover { background:var(--hover); border-color:#4a4a56; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:var(--accent-d); }
  button.ghost { background:transparent; border-color:transparent; color:var(--dim); }
  button.ghost:hover { background:var(--hover); color:var(--text); }
  button.sm { padding:4px 9px; font-size:11px; }
  button.icon { padding:4px 8px; font-size:14px; line-height:1; }

  label.fld { display:block; margin-bottom:13px; }
  label.fld span { display:block; font-size:11px; color:var(--dim); margin-bottom:5px;
    font-weight:500; letter-spacing:.2px; }
  input, select, textarea {
    width:100%; font:inherit; font-size:13px; background:var(--bg); color:var(--text);
    border:1px solid var(--border2); border-radius:7px; padding:8px 10px; transition:.12s;
  }
  textarea { resize:vertical; min-height:74px; line-height:1.55; }
  input:focus, select:focus, textarea:focus {
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,108,245,.15);
  }

  .dot { width:7px; height:7px; border-radius:50%; flex:none; }
  .dot.active { background:var(--green); } .dot.paused { background:var(--amber); }
  .live { width:7px; height:7px; border-radius:50%; background:var(--green);
    box-shadow:0 0 0 0 rgba(65,184,96,.5); animation:pulse 2.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(65,184,96,.45)} 70%{box-shadow:0 0 0 7px rgba(65,184,96,0)} 100%{box-shadow:0 0 0 0 rgba(65,184,96,0)} }

  .lbl { font-size:10.5px; font-weight:600; letter-spacing:.9px; text-transform:uppercase;
    color:var(--faint); }
  .badge { font-size:10px; font-weight:600; letter-spacing:.4px; text-transform:uppercase;
    padding:3px 8px; border-radius:20px; border:1px solid var(--border2); }
  .badge.active { color:var(--green); border-color:#2a4736; background:rgba(65,184,96,.08); }
  .badge.paused { color:var(--amber); border-color:#4a3f28; background:rgba(216,166,87,.08); }

  /* ---- top bar ---- */
  #top { height:52px; display:flex; align-items:center; gap:13px; padding:0 18px;
    border-bottom:1px solid var(--border); background:var(--surface); }
  #top .brand { font-size:15px; font-weight:700; letter-spacing:.3px; }
  #top .brand .v { color:var(--faint); font-weight:500; font-size:12px; margin-left:3px; }
  #top .sub { color:var(--faint); font-size:12px; }
  #top .stats { margin-left:auto; display:flex; align-items:center; gap:7px; }
  .stat { display:flex; align-items:baseline; gap:5px; background:var(--surface2);
    border:1px solid var(--border); border-radius:7px; padding:5px 11px; }
  .stat b { font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
  .stat span { font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.5px; }

  /* ---- layout ---- */
  #app { display:flex; height:calc(100vh - 52px); }
  #side { width:248px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; }
  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
  #rail { width:316px; flex:none; background:var(--surface); border-left:1px solid var(--border);
    overflow-y:auto; padding:16px; }

  .panhead { display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 9px; }

  /* ---- companies ---- */
  #colist { overflow-y:auto; padding:0 10px 10px; flex:1; }
  .co { padding:10px 11px; border-radius:9px; cursor:pointer; margin-bottom:3px;
    border:1px solid transparent; transition:.1s; }
  .co:hover { background:var(--surface2); }
  .co.sel { background:var(--surface2); border-color:var(--border2); }
  .co .r1 { display:flex; align-items:center; gap:7px; }
  .co .nm { font-weight:600; font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  .co .meta { font-size:11px; color:var(--faint); margin:3px 0 0 14px; }
  .bar { height:4px; background:var(--bg); border-radius:3px; overflow:hidden; margin:6px 0 0 14px; }
  .bar > i { display:block; height:100%; background:var(--accent); border-radius:3px; }
  .bar > i.over { background:var(--red); }

  /* ---- company header ---- */
  #cohead { padding:18px 22px 14px; border-bottom:1px solid var(--border); }
  #cohead .t { display:flex; align-items:flex-start; gap:12px; }
  #cohead h1 { font-size:20px; font-weight:700; letter-spacing:-.2px; }
  #cohead .mission { color:var(--dim); font-size:12.5px; margin-top:3px; }
  #cohead .acts { margin-left:auto; display:flex; gap:8px; flex:none; }
  #cohead .money { display:flex; gap:18px; margin-top:13px; }
  #cohead .money .k { font-size:11px; color:var(--faint); }
  #cohead .money .vv { font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }

  #agents { padding:12px 22px; border-bottom:1px solid var(--border);
    display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:7px; background:var(--surface2);
    border:1px solid var(--border); border-radius:20px; padding:5px 11px; font-size:12px; }
  .chip .av { width:18px; height:18px; border-radius:50%; background:var(--accent-d);
    color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center;
    justify-content:center; }
  .rtag { font-size:9.5px; font-weight:600; padding:2px 6px; border-radius:5px;
    background:var(--bg); color:var(--faint); letter-spacing:.3px; }
  .rtag.cc { color:var(--blue); } .rtag.native { color:var(--amber); }

  /* ---- kanban ---- */
  #board { flex:1; display:flex; gap:14px; padding:16px 22px; overflow:hidden; }
  .lane { flex:1; min-width:0; display:flex; flex-direction:column;
    background:var(--surface); border:1px solid var(--border); border-radius:11px; }
  .lane > h3 { font-size:11px; font-weight:600; letter-spacing:.7px; text-transform:uppercase;
    color:var(--dim); padding:12px 13px 9px; display:flex; justify-content:space-between; }
  .lane > h3 .ct { color:var(--faint); background:var(--surface2); border-radius:10px;
    padding:0 7px; font-size:10.5px; }
  .lane .cards { overflow-y:auto; padding:0 9px 9px; display:flex; flex-direction:column; gap:7px; }
  .icard { background:var(--surface2); border:1px solid var(--border); border-radius:9px;
    padding:10px 11px; cursor:pointer; transition:.1s; border-left:2.5px solid var(--border2); }
  .icard:hover { background:var(--hover); border-color:var(--border2); transform:translateY(-1px); }
  .icard.p-high { border-left-color:var(--red); }
  .icard.p-medium { border-left-color:var(--amber); }
  .icard.p-low { border-left-color:var(--faint); }
  .icard .id { font-size:10px; font-weight:600; color:var(--faint); letter-spacing:.4px; }
  .icard .ti { font-size:12.5px; margin-top:3px; font-weight:500; }
  .icard .ft { display:flex; align-items:center; gap:7px; margin-top:8px; }
  .icard .pri { font-size:10px; color:var(--dim); text-transform:capitalize; }
  .icard .av { width:17px; height:17px; border-radius:50%; background:var(--accent-d);
    color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center;
    justify-content:center; margin-left:auto; }

  /* ---- rail ---- */
  .rsec { margin-bottom:6px; }
  .rsec .lbl { display:block; margin:14px 0 9px; }
  .rsec:first-child .lbl { margin-top:0; }
  .feed { padding:8px 0; border-bottom:1px solid var(--border); font-size:12px;
    display:flex; align-items:center; gap:8px; }
  .feed:last-child { border:0; }
  .feed .vb { font-weight:600; }
  .feed .vb.ok { color:var(--green); } .feed .vb.bad { color:var(--red); }
  .feed .by { color:var(--faint); }
  .feed .ag { margin-left:auto; color:var(--faint); font-size:11px; flex:none; }
  .runrow { display:flex; align-items:center; gap:8px; padding:8px 0;
    border-bottom:1px solid var(--border); font-size:12px; }
  .runrow:last-child { border:0; }
  .st { font-size:10px; font-weight:700; letter-spacing:.4px; }
  .st.Succeeded { color:var(--green); } .st.Failed { color:var(--red); }
  .st.Running { color:var(--blue); } .st.Stalled { color:var(--amber); }

  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center;
    flex:1; gap:14px; color:var(--dim); text-align:center; padding:40px; }
  .empty .big { font-size:15px; color:var(--text); font-weight:600; }

  /* ---- modal ---- */
  #mroot { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); backdrop-filter:blur(3px); z-index:50; }
  #mroot.on { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border2); border-radius:14px;
    box-shadow:var(--sh); width:440px; max-width:92vw; max-height:88vh; overflow:hidden;
    display:flex; flex-direction:column; animation:pop .14s ease-out; }
  .modal.wide { width:600px; }
  @keyframes pop { from{opacity:0; transform:scale(.97) translateY(6px)} }
  .modal > header { display:flex; align-items:center; gap:10px; padding:15px 18px;
    border-bottom:1px solid var(--border); }
  .modal > header .h { font-size:14px; font-weight:600; flex:1; }
  .modal .mbody { padding:18px; overflow-y:auto; }
  .modal > footer { display:flex; gap:9px; justify-content:flex-end; padding:13px 18px;
    border-top:1px solid var(--border); }

  .meta-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0 14px; }
  .pill { background:var(--surface2); border:1px solid var(--border); border-radius:7px;
    padding:4px 9px; font-size:11px; color:var(--dim); }
  .pill b { color:var(--text); font-weight:600; }
  .box { background:var(--bg); border:1px solid var(--border); border-radius:9px;
    padding:11px 13px; font-size:12.5px; line-height:1.6; white-space:pre-wrap;
    word-break:break-word; }
  .box.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px;
    color:var(--dim); }
  h4.sec { font-size:11px; font-weight:600; letter-spacing:.6px; text-transform:uppercase;
    color:var(--faint); margin:18px 0 8px; }
</style>
</head>
<body>

<div id="top">
  <span class="brand">◯ O<span class="v">v4</span></span>
  <span class="sub">agent-company orchestrator</span>
  <div class="stats" id="stats"></div>
</div>

<div id="app">
  <div id="side">
    <div class="panhead"><span class="lbl">Companies</span>
      <button class="icon" onclick="mCompany()" title="New company">+</button></div>
    <div id="colist"></div>
  </div>
  <div id="main"></div>
  <div id="rail">
    <div class="rsec"><span class="lbl">Activity</span><div id="activity"></div></div>
    <div class="rsec"><span class="lbl">Recent runs</span><div id="runs"></div></div>
  </div>
</div>

<div id="mroot" onclick="if(event.target===this)closeM()"></div>

<script>
//--- helpers ---------------------------------------------------------
const $  = s => document.querySelector(s);
const api  = p => fetch('/api'+p).then(r=>r.json());
const post = (p,b) => fetch('/api'+p,{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(b)}).then(r=>r.json());
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = c => '$'+((Number(c)||0)/100).toFixed(2);
const ago = ts => { const s=(Date.now()-ts)/1000;
  if(s<60)return Math.max(0,Math.floor(s))+'s'; if(s<3600)return Math.floor(s/60)+'m';
  if(s<86400)return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d'; };
const dur = (a,b) => { if(!a||!b)return '–'; const s=(b-a)/1000;
  return s<60?s.toFixed(1)+'s':Math.floor(s/60)+'m'+Math.round(s%60)+'s'; };
const initials = n => (n||'?').trim().slice(0,2).toUpperCase();
const LANES = ['Backlog','In Progress','Done'];

let S = { companies:[], sel:null, issues:[], agents:[], runs:[], activity:[], orch:{} };
let modalOpen = false;
const cache = {};
function paint(id,html){ const e=$('#'+id); if(e && cache[id]!==html){ e.innerHTML=html; cache[id]=html; } }

//--- polling ---------------------------------------------------------
async function poll(){
  try {
    const [companies,orch,runs,activity] = await Promise.all(
      [api('/companies'),api('/orchestrator'),api('/runs'),api('/activity')]);
    S.companies=companies; S.orch=orch; S.runs=runs; S.activity=activity;
    if(!S.sel && companies.length) S.sel=companies[0].id;
    if(S.sel && companies.some(c=>c.id===S.sel)){
      S.issues = await api('/companies/'+S.sel+'/issues');
      S.agents = await api('/companies/'+S.sel+'/agents');
    } else { S.sel=companies[0]?.id||null; S.issues=[]; S.agents=[]; }
    render();
  } catch(e){ console.error('poll',e); }
}

//--- render (change-detected, never touches #mroot) ------------------
function render(){
  const o=S.orch;
  paint('stats',
    `<div class="stat"><b>${o.tick??'–'}</b><span>tick</span></div>
     <div class="stat"><b>${o.running??'–'}</b><span>running</span></div>
     <div class="stat"><b>${o.retrying??'–'}</b><span>retry</span></div>
     <div class="stat"><span class="live"></span></div>`);

  paint('colist', S.companies.map(c=>{
    const pct=c.budget_monthly_cents>0?Math.min(100,100*c.spent_cents/c.budget_monthly_cents):0;
    const over=c.budget_monthly_cents>0&&c.spent_cents>=c.budget_monthly_cents;
    return `<div class="co ${c.id===S.sel?'sel':''}" onclick="sel('${c.id}')">
      <div class="r1"><span class="dot ${c.status}"></span><span class="nm">${esc(c.name)}</span></div>
      <div class="meta">${esc(c.issue_prefix)} · ${money(c.spent_cents)}${
        c.budget_monthly_cents>0?' / '+money(c.budget_monthly_cents):''}</div>
      ${c.budget_monthly_cents>0?`<div class="bar"><i class="${over?'over':''}" style="width:${pct}%"></i></div>`:''}
    </div>`; }).join('') ||
    `<div style="padding:20px 12px;color:var(--faint);font-size:12px">No companies yet.</div>`);

  renderMain();

  paint('activity', S.activity.slice(0,26).map(a=>{
    const ok=/succeed|create|hire|approv/.test(a.verb), bad=/fail|exceed|stall|reject/.test(a.verb);
    return `<div class="feed"><span class="vb ${ok?'ok':bad?'bad':''}">${esc(a.verb)}</span>
      <span class="by">${esc(a.actor)}</span><span class="ag">${ago(a.ts)}</span></div>`;
  }).join('') || `<div style="color:var(--faint);font-size:12px;padding:6px 0">Nothing yet.</div>`);

  paint('runs', S.runs.slice(0,16).map(r=>
    `<div class="runrow"><span class="st ${r.state}">${r.state}</span>
      <span class="by" style="color:var(--faint)">attempt ${r.attempt}</span>
      <span class="ag" style="margin-left:auto;color:var(--dim)">${r.cost_cents?money(r.cost_cents):''}</span></div>`
  ).join('') || `<div style="color:var(--faint);font-size:12px;padding:6px 0">No runs yet.</div>`);
}

function renderMain(){
  const c=S.companies.find(x=>x.id===S.sel);
  if(!c){ paint('main',`<div class="empty"><div class="big">Welcome to O v4</div>
    <div>Create a company, hire an agent, file issues —<br/>then watch them get done.</div>
    <button class="primary" onclick="mCompany()">Create a company</button></div>`); return; }
  const over=c.budget_monthly_cents>0&&c.spent_cents>=c.budget_monthly_cents;
  const lanes=LANES.map(L=>{
    const items=S.issues.filter(i=>i.status===L);
    return `<div class="lane"><h3>${L}<span class="ct">${items.length}</span></h3>
      <div class="cards">${items.map(i=>{
        const ag=S.agents.find(a=>a.id===i.assignee_agent_id);
        return `<div class="icard p-${i.priority||'medium'}" onclick="mIssue('${i.id}')">
          <div class="id">${esc(i.identifier)}</div>
          <div class="ti">${esc(i.title)}</div>
          <div class="ft"><span class="pri">${esc(i.priority||'medium')}</span>
            ${ag?`<span class="av" title="${esc(ag.name)}">${initials(ag.name)}</span>`:''}</div>
        </div>`; }).join('')}</div></div>`;
  }).join('');
  paint('main',
    `<div id="cohead">
      <div class="t">
        <div><h1>${esc(c.name)}</h1>
          <div class="mission">${esc(c.mission)||'<span style="color:var(--faint)">no mission set</span>'}</div></div>
        <span class="badge ${c.status}">${c.status}</span>
        <div class="acts">
          <button class="primary sm" onclick="mIssueNew()">+ Issue</button>
          <button class="sm" onclick="mAgent()">Hire agent</button>
          <button class="sm" onclick="mManage()">Manage</button>
        </div>
      </div>
      <div class="money">
        <div><div class="k">Spent</div><div class="vv">${money(c.spent_cents)}</div></div>
        <div><div class="k">Budget</div><div class="vv">${c.budget_monthly_cents>0?money(c.budget_monthly_cents):'—'}</div></div>
        <div><div class="k">Issues</div><div class="vv">${S.issues.length}</div></div>
        <div><div class="k">Agents</div><div class="vv">${S.agents.length}</div></div>
        ${over?`<div style="align-self:center;color:var(--amber);font-size:11.5px">⚠ budget cap reached — paused</div>`:''}
      </div>
    </div>
    <div id="agents">${
      S.agents.map(a=>`<span class="chip"><span class="av">${initials(a.name)}</span>
        ${esc(a.name)}<span class="rtag ${a.runtime==='claude-code'?'cc':a.runtime}">${a.runtime}</span></span>`).join('')
      || `<span style="color:var(--faint);font-size:12px">No agents yet — issues won't run until you hire one.</span>`
    }</div>
    <div id="board">${lanes}</div>`);
}

function sel(id){ S.sel=id; poll(); }

//--- modals (live in #mroot, untouched by render) --------------------
function openM(html){ $('#mroot').innerHTML='<div class="modal'+(html.wide?' wide':'')+'">'+html.body+'</div>';
  $('#mroot').classList.add('on'); modalOpen=true; }
function closeM(){ $('#mroot').classList.remove('on'); $('#mroot').innerHTML=''; modalOpen=false; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeM(); });
const F = (h)=>`<header><span class="h">${h.title}</span>
  <button class="ghost icon" onclick="closeM()">✕</button></header>
  <div class="mbody">${h.body}</div>
  <footer><button class="ghost" onclick="closeM()">Cancel</button>${h.foot}</footer>`;

function mCompany(){ openM({ body:F({ title:'New company',
  body:`<label class="fld"><span>Name</span><input id="i-name" placeholder="Acme Inc" autofocus></label>
   <label class="fld"><span>Mission</span><input id="i-mission" placeholder="what this company is for"></label>
   <label class="fld"><span>Issue prefix</span><input id="i-prefix" placeholder="ACME" value="TASK"></label>
   <label class="fld"><span>Monthly budget (USD, optional)</span><input id="i-budget" type="number" placeholder="0 = unlimited"></label>`,
  foot:`<button class="primary" onclick="doCompany()">Create company</button>` })}); }
async function doCompany(){
  const name=$('#i-name').value.trim(); if(!name)return $('#i-name').focus();
  await post('/companies',{ name, mission:$('#i-mission').value.trim(),
    issue_prefix:$('#i-prefix').value.trim()||'TASK',
    budget_monthly_cents:Math.round((parseFloat($('#i-budget').value)||0)*100) });
  closeM(); poll();
}

function mIssueNew(){ openM({ body:F({ title:'New issue',
  body:`<label class="fld"><span>Title</span><input id="i-title" placeholder="what needs doing" autofocus></label>
   <label class="fld"><span>Details for the agent</span><textarea id="i-body" placeholder="context, acceptance criteria, files to touch..."></textarea></label>
   <label class="fld"><span>Priority</span><select id="i-prio">
     <option value="high">high</option><option value="medium" selected>medium</option>
     <option value="low">low</option></select></label>`,
  foot:`<button class="primary" onclick="doIssue()">File issue</button>` })}); }
async function doIssue(){
  const title=$('#i-title').value.trim(); if(!title)return $('#i-title').focus();
  await post('/companies/'+S.sel+'/issues',{ title, body:$('#i-body').value.trim(),
    priority:$('#i-prio').value });
  closeM(); poll();
}

function mAgent(){ openM({ body:F({ title:'Hire an agent',
  body:`<label class="fld"><span>Name</span><input id="a-name" placeholder="Ada" autofocus></label>
   <label class="fld"><span>Role</span><input id="a-role" placeholder="engineer" value="engineer"></label>
   <label class="fld"><span>Runtime</span><select id="a-rt">
     <option value="claude-code">claude-code — real headless Claude</option>
     <option value="sim">sim — deterministic stub (no spend)</option>
     <option value="native">native — LLM over HTTP</option></select></label>
   <p style="color:var(--faint);font-size:11.5px">claude-code agents run real <code>claude -p</code> sessions in an isolated workspace per issue.</p>`,
  foot:`<button class="primary" onclick="doAgent()">Hire</button>` })}); }
async function doAgent(){
  const name=$('#a-name').value.trim(); if(!name)return $('#a-name').focus();
  const r=await post('/companies/'+S.sel+'/agents',{ name, role:$('#a-role').value.trim()||'generalist',
    runtime:$('#a-rt').value });
  closeM();
  if(r&&r.status==='pending_approval') alert('Approval required — queued in /api/approvals');
  poll();
}

function mManage(){ const c=S.companies.find(x=>x.id===S.sel); if(!c)return;
  openM({ body:F({ title:'Manage '+esc(c.name),
  body:`<label class="fld"><span>Monthly budget (USD)</span>
     <input id="m-budget" type="number" value="${(c.budget_monthly_cents/100)||0}"></label>
   <label class="fld"><span>Status</span><select id="m-status">
     <option value="active" ${c.status==='active'?'selected':''}>active</option>
     <option value="paused" ${c.status==='paused'?'selected':''}>paused</option></select></label>
   <p style="color:var(--faint);font-size:11.5px">Set status to <b>active</b> to resume a company that was budget-paused.</p>`,
  foot:`<button class="primary" onclick="doManage('${c.id}')">Save</button>` })}); }
async function doManage(id){
  await post('/companies/'+id,{ budget_monthly_cents:Math.round((parseFloat($('#m-budget').value)||0)*100),
    status:$('#m-status').value });
  closeM(); poll();
}

//--- issue detail ----------------------------------------------------
async function mIssue(id){
  const i=S.issues.find(x=>x.id===id); if(!i)return;
  const ag=S.agents.find(a=>a.id===i.assignee_agent_id);
  const runs=S.runs.filter(r=>r.issue_id===id);
  openM({ wide:true, body:F({ title:esc(i.identifier)+'  ·  '+esc(i.status),
   body:`<div style="font-size:16px;font-weight:600;margin-bottom:2px">${esc(i.title)}</div>
    <div class="meta-row">
      <span class="badge ${i.status==='Done'?'active':'paused'}">${esc(i.status)}</span>
      <span class="pill">priority <b>${esc(i.priority||'medium')}</b></span>
      <span class="pill">agent <b>${ag?esc(ag.name):'unassigned'}</b></span>
    </div>
    ${i.body?`<div class="box">${esc(i.body)}</div>`:'<div style="color:var(--faint);font-size:12px">No details provided.</div>'}
    <h4 class="sec">Runs (${runs.length})</h4>
    ${runs.length?runs.map(r=>`<div class="runrow">
        <span class="st ${r.state}">${r.state}</span>
        <span style="color:var(--faint)">attempt ${r.attempt}</span>
        <span style="color:var(--dim)">${dur(r.started_at,r.ended_at)}</span>
        <span style="margin-left:auto;color:var(--dim)">${r.cost_cents?money(r.cost_cents):''}</span>
      </div>`).join(''):'<div style="color:var(--faint);font-size:12px">Not run yet — the orchestrator will pick it up.</div>'}
    <div id="rr"></div>` ,
   foot:`<button class="primary" onclick="closeM()">Close</button>` })});
  // load the agent's output for the latest run that has a workspace
  const last=runs[0];
  if(last){
    try{ const r=await api('/runs/'+last.id+'/result');
      let summary='', raw=r.result||'';
      try{ summary=JSON.parse(raw).result||''; }catch(_){}
      const rr=$('#rr'); if(rr) rr.innerHTML =
        `<h4 class="sec">Agent result</h4>`+
        (summary?`<div class="box">${esc(summary)}</div>`:
          raw?`<div class="box mono">${esc(raw.slice(0,1200))}</div>`:
          `<div style="color:var(--faint);font-size:12px">No result artifact (sim run or none produced).</div>`)+
        (r.workspace?`<div class="box mono" style="margin-top:7px">workspace · ${esc(r.workspace)}</div>`:'');
    }catch(_){}
  }
}

poll();
setInterval(()=>{ if(!modalOpen) poll(); }, 3000);
</script>
