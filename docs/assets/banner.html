<!-- Source for docs/assets/banner.png (2400x760). Render: open in Chromium at 2400x760 and screenshot #b. -->
<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --bg:#111115; --cream:#ede6d6; --dim:#8d887e; --line:#2a2a30; --red:#c81e0f; }
  html,body { margin:0; background:var(--bg); }
  #b { position:relative; width:2400px; height:760px; background:var(--bg); overflow:hidden; }
  canvas { position:absolute; left:0; top:0; }
  .lbl { position:absolute; left:120px; top:96px; font:500 17px 'JetBrains Mono'; letter-spacing:.32em; color:var(--dim); }
  .dash { position:absolute; left:124px; top:146px; width:52px; height:5px; background:var(--cream); }
  .name { position:absolute; left:112px; top:170px; font:300 300px/1 'Newsreader'; color:var(--cream); letter-spacing:-.02em; }
  .tag { position:absolute; left:122px; top:452px; font:italic 300 64px 'Newsreader'; color:var(--cream); letter-spacing:-.01em; }
  .mono { position:absolute; left:124px; top:566px; font:400 25px/1.75 'JetBrains Mono'; letter-spacing:.24em; color:var(--dim); }
  .frame { position:absolute; left:1460px; top:80px; width:820px; height:600px; border:1px solid #33333a; }
  .cap { position:absolute; left:1482px; top:640px; font:400 14px 'JetBrains Mono'; letter-spacing:.3em; color:var(--dim); }
  .node { position:absolute; font:500 14px 'JetBrains Mono'; letter-spacing:.2em; color:var(--dim); transform:translate(-50%,0); }
</style></head><body>
<div id="b">
  <canvas id="c" width="2400" height="760"></canvas>
  <div class="lbl">O / SWARMD</div><div class="dash"></div>
  <div class="name">O</div>
  <div class="tag">software that ships itself.</div>
  <div class="mono">ISSUES IN · VERIFIED MERGES OUT<br>BUILT ON SWARMRT · MIT</div>
  <div class="frame"></div>
  <div class="cap">THE LOOP · ISSUE → AGENT → VERIFY → REVIEW → CI → MERGE</div>
  <div id="labels"></div>
</div>
<script>
document.fonts.ready.then(draw);
function draw(){
const c = document.getElementById('c'), g = c.getContext('2d');
const CREAM = '237,230,214', DIM = '138,133,124', RED = '200,30,15';
// ASCII dither: density -> glyph, broken up by a 4x4 Bayer threshold so
// edges stay crisp and grainy instead of smooth.
const RAMP = ' .:-=+*#%@';
const B = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r=>r.map(v=>(v+.5)/16));
const CW = 11, CH = 15;
g.textBaseline = 'top';
function glyphs(cx, cy, r, col, gain=1, font=14) {
  g.font = `500 ${font}px 'JetBrains Mono'`;
  for (let y = cy - r; y <= cy + r; y += CH) for (let x = cx - r; x <= cx + r; x += CW) {
    const d = Math.hypot((x - cx), (y - cy) * 1.0) / r; if (d > 1) continue;
    let v = Math.pow(1 - d, 1.25) * gain;
    const t = B[((y/CH)|0) & 3][((x/CW)|0) & 3];
    v = v + (t - .5) * .35; if (v <= .06) continue;
    const ch = RAMP[Math.min(RAMP.length - 1, Math.max(1, Math.round(v * (RAMP.length - 1))))];
    g.fillStyle = `rgba(${col},${Math.min(1, .45 + v)})`;
    g.fillText(ch, x | 0, y | 0);
  }
}
function path(pts, ch, col, every) {
  g.font = `400 14px 'JetBrains Mono'`; g.fillStyle = `rgb(${col})`;
  pts.forEach((p,i)=>{ if (i % every) return; g.fillText(ch, p[0]|0, p[1]|0); });
}
// ---- the loop, inside the frame
const cx = 1862, cy = 360, rx = 300, ry = 178;
const names = ['issue','agent','verify','review','ci','merge'];
const ang = names.map((_,i)=> -Math.PI/2 + i * 2*Math.PI/names.length);
const pos = ang.map(a=>[cx + rx*Math.cos(a), cy + ry*Math.sin(a)]);
const ring=[]; for (let t=0; t<2*Math.PI; t+=0.004) ring.push([cx+rx*Math.cos(t), cy+ry*Math.sin(t)]);
path(ring, '·', DIM, 7);
// the control plane at the centre: one SQLite file
glyphs(cx, cy, 80, CREAM, .62, 13);
pos.forEach((p,i)=> glyphs(p[0], p[1], i===5 ? 64 : 50, CREAM, i===5 ? 1.3 : 1.15));
// a regression: red node thrown off MERGE, a dotted revert arc back to ISSUE
const m = pos[5], red = [m[0] + 36, m[1] - 112];
glyphs(red[0], red[1], 36, RED, 1.35);
const rv=[]; for(let t=0;t<=1;t+=0.005){ rv.push([red[0]+(pos[0][0]-red[0])*t, red[1]+(pos[0][1]-red[1])*t - Math.sin(Math.PI*t)*70]); }
path(rv.slice(14, -18), '·', RED, 6);
// labels
const L = document.getElementById('labels');
const off = [[0,-86],[70,-70],[70,40],[0,62],[-70,40],[-80,-76]];
pos.forEach((p,i)=>{ const el=document.createElement('div'); el.className='node'; el.textContent=names[i].toUpperCase();
  el.style.left=(p[0]+off[i][0])+'px'; el.style.top=(p[1]+off[i][1])+'px'; L.appendChild(el); });
const rl=document.createElement('div'); rl.className='node'; rl.textContent='REVERT'; rl.style.color='#c81e0f';
rl.style.left=(red[0]-70)+'px'; rl.style.top=(red[1]-58)+'px'; L.appendChild(rl);
const sq=document.createElement('div'); sq.className='node'; sq.textContent='O.DB'; sq.style.left=cx+'px'; sq.style.top=(cy+84)+'px'; L.appendChild(sq);
// ---- agents in flight between the text and the frame
[[1060,196,28],[1290,300,18],[1160,438,24],[1336,548,17],[1040,604,22],[1250,150,14]].forEach(([x,y,r])=>glyphs(x,y,r,CREAM,1.25));
}
</script></body></html>
