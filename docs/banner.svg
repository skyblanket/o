<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="O — the autonomous software loop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf3c4"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6478"/>
    </marker>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#1d2330" stroke-width="1">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280"/>
    <path d="M160 0 V400 M320 0 V400 M480 0 V400 M640 0 V400 M800 0 V400 M960 0 V400 M1120 0 V400"/>
  </g>
  <!-- the mark: a loop with a running dot -->
  <circle cx="210" cy="200" r="104" fill="none" stroke="url(#ring)" stroke-width="30"/>
  <circle cx="210" cy="200" r="104" fill="none" stroke="#0b0d12" stroke-width="6" stroke-dasharray="2 34" opacity="0.55"/>
  <circle cx="300" cy="148" r="13" fill="#e9fff6"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="372" y="182" font-size="88" font-weight="800" fill="#f4f6fb" letter-spacing="-2">O</text>
    <text x="466" y="182" font-size="34" font-weight="500" fill="#9aa4b8">the autonomous software loop</text>
    <text x="374" y="230" font-size="22" fill="#c9d0de">Issues in. Verified, reviewed, CI-gated merges out. Reverts what regresses.</text>
    <text x="374" y="262" font-size="22" fill="#c9d0de">Budgets itself, sandboxes its agents, and files its own follow-up work.</text>
    <g font-size="17" font-weight="600">
      <g transform="translate(374 300)">
        <rect width="88" height="36" rx="18" fill="#1b2130" stroke="#2c3446"/><text x="44" y="24" text-anchor="middle" fill="#c9d0de">issue</text>
        <path d="M94 18 H118" stroke="#5b6478" stroke-width="2" marker-end="url(#arr)"/>
        <rect x="124" width="88" height="36" rx="18" fill="#1b2130" stroke="#2c3446"/><text x="168" y="24" text-anchor="middle" fill="#c9d0de">agent</text>
        <path d="M218 18 H242" stroke="#5b6478" stroke-width="2" marker-end="url(#arr)"/>
        <rect x="248" width="88" height="36" rx="18" fill="#1b2130" stroke="#2c3446"/><text x="292" y="24" text-anchor="middle" fill="#c9d0de">verify</text>
        <path d="M342 18 H366" stroke="#5b6478" stroke-width="2" marker-end="url(#arr)"/>
        <rect x="372" width="88" height="36" rx="18" fill="#1b2130" stroke="#2c3446"/><text x="416" y="24" text-anchor="middle" fill="#c9d0de">review</text>
        <path d="M466 18 H490" stroke="#5b6478" stroke-width="2" marker-end="url(#arr)"/>
        <rect x="496" width="104" height="36" rx="18" fill="#1b2130" stroke="#2c3446"/><text x="548" y="24" text-anchor="middle" fill="#c9d0de">PR + CI</text>
        <path d="M606 18 H630" stroke="#5b6478" stroke-width="2" marker-end="url(#arr)"/>
        <rect x="636" width="96" height="36" rx="18" fill="#123528" stroke="#2f7a5c"/><text x="684" y="24" text-anchor="middle" fill="#7cf3c4">merged</text>
      </g>
    </g>
  </g>
</svg>
